<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --border: #262a33;
    --text: #e8e9ec;
    --muted: #8b8f99;
    --accent: #6c5ce7;
    --accent-hover: #5b4bd6;
    --done: #34c77b;
    --danger: #e2574c;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1d26, var(--bg) 60%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 {
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 28px; }

  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .add-row input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color .15s;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 0 22px;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .add-row button:hover { background: var(--accent-hover); }
  .add-row button:active { transform: scale(0.97); }

  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
    padding: 0 4px;
  }

  .task-list { display: flex; flex-direction: column; gap: 8px; }

  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 14px;
    transition: border-color .15s, opacity .2s;
  }
  .task:hover { border-color: #34384433; }

  .checkbox {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
  }
  .checkbox.done {
    background: var(--done);
    border-color: var(--done);
  }
  .checkbox.done::after {
    content: "✓";
    color: #0f1115;
    font-size: 13px;
    font-weight: 800;
  }

  .title {
    flex: 1;
    font-size: 15px;
    outline: none;
    border: none;
    background: transparent;
    color: var(--text);
    padding: 2px 0;
    cursor: default;
  }
  .title:not([readonly]) {
    cursor: text;
    border-bottom: 1px dashed var(--accent);
  }
  .task.done .title { color: var(--muted); text-decoration: line-through; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 15px;
    padding: 8px;
    border-radius: 8px;
    line-height: 1;
    transition: color .15s, background .15s;
    flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); background: #ffffff0d; }
  .del-btn:hover { color: var(--danger); background: #e2574c1a; }

  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    margin-inline-end: 6px;
  }
  .status-dot.online { background: var(--done); }
  .status-dot.offline { background: var(--danger); }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 48px 0;
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--danger);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>✅ Tasks</h1>
    <div class="subtitle"><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>

    <div class="add-row">
      <input id="newTaskInput" type="text" placeholder="Naya task likhein..." maxlength="200" />
      <button id="addBtn">Add</button>
    </div>

    <div class="stats">
      <span id="statsText">Loading...</span>
    </div>

    <div class="task-list" id="taskList"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const API = "/tasks";
const listEl = document.getElementById("taskList");
const inputEl = document.getElementById("newTaskInput");
const addBtn = document.getElementById("addBtn");
const statsEl = document.getElementById("statsText");
const toastEl = document.getElementById("toast");

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");

function setStatus(online) {
  statusDot.className = "status-dot " + (online ? "online" : "offline");
  statusText.textContent = online ? "Connected" : "Server se connect nahi ho raha";
}

async function fetchTasks() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error("Failed to load tasks");
    const tasks = await res.json();
    setStatus(true);
    renderTasks(tasks);
  } catch (err) {
    setStatus(false);
    showToast("Tasks load nahi ho sake");
  }
}

function renderTasks(tasks) {
  listEl.innerHTML = "";

  if (tasks.length === 0) {
    listEl.innerHTML = `<div class="empty">Koi task nahi hai — upar se ek add karein 🎉</div>`;
    statsEl.textContent = "0 tasks";
    return;
  }

  const doneCount = tasks.filter(t => t.done).length;
  statsEl.textContent = `${doneCount} / ${tasks.length} complete`;

  tasks.forEach(task => {
    const row = document.createElement("div");
    row.className = "task" + (task.done ? " done" : "");

    const checkbox = document.createElement("div");
    checkbox.className = "checkbox" + (task.done ? " done" : "");
    checkbox.onclick = () => toggleDone(task);

    const title = document.createElement("input");
    title.className = "title";
    title.value = task.title;
    title.readOnly = true;

    function saveTitle() {
      title.readOnly = true;
      editBtn.textContent = "✎";
      const val = title.value.trim();
      if (val && val !== task.title) {
        updateTitle(task.id, val);
      } else {
        title.value = task.title;
      }
    }

    title.addEventListener("keydown", (e) => {
      if (e.key === "Enter") title.blur();
      if (e.key === "Escape") { title.value = task.title; title.blur(); }
    });
    title.addEventListener("blur", saveTitle);

    const editBtn = document.createElement("button");
    editBtn.className = "icon-btn edit-btn";
    editBtn.innerHTML = "✎";
    editBtn.title = "Edit";
    editBtn.onclick = () => {
      title.readOnly = false;
      title.focus();
      title.select();
    };

    const delBtn = document.createElement("button");
    delBtn.className = "icon-btn del-btn";
    delBtn.innerHTML = "✕";
    delBtn.title = "Delete";
    delBtn.onclick = () => {
      if (confirm(`Delete "${task.title}"?`)) deleteTask(task.id);
    };

    row.append(checkbox, title, editBtn, delBtn);
    listEl.appendChild(row);
  });
}

async function addTask() {
  const title = inputEl.value.trim();
  if (!title) return;

  addBtn.disabled = true;
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || "Add failed");
    }
    inputEl.value = "";
    await fetchTasks();
  } catch (err) {
    showToast(err.message);
  } finally {
    addBtn.disabled = false;
  }
}

async function toggleDone(task) {
  try {
    const res = await fetch(`${API}/${task.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ done: !task.done })
    });
    if (!res.ok) throw new Error("Update failed");
    await fetchTasks();
  } catch (err) {
    showToast(err.message);
  }
}

async function updateTitle(id, newTitle) {
  try {
    const res = await fetch(`${API}/${id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: newTitle })
    });
    if (!res.ok) throw new Error("Title update failed");
    await fetchTasks();
  } catch (err) {
    showToast(err.message);
  }
}

async function deleteTask(id) {
  try {
    const res = await fetch(`${API}/${id}`, { method: "DELETE" });
    if (!res.ok) throw new Error("Delete failed");
    await fetchTasks();
  } catch (err) {
    showToast(err.message);
  }
}

addBtn.addEventListener("click", addTask);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") addTask();
});

fetchTasks();
</script>
</body>
</html>`
